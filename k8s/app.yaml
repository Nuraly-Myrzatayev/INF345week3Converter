apiVersion: apps/v1
kind: Deployment
metadata:
  name: mine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mine
  template:
    metadata:
      labels:
        app: mine
    spec:
      containers:
        - name: app
          # 7. your M3 image: owner/project in lowercase, a colon, the FULL 40-character SHA
          image: ghcr.io/nuraly-myrzatayev/inf345week3converter:cf9ad445fba24d4fa205a506a1bff30aba778784
          env:
            - name: PORT
              value: "80"               # 8. the port your app should listen on - you choose it
          ports:
            - containerPort: 80         # 9. the same number as 8
---
apiVersion: v1
kind: Service
metadata:
  name: mine
spec:
  selector:
    app: mine
  ports:
    - port: 80
      targetPort: 80                    # 10. the same number again
